# OpenEvolve pilot, task T2.
max_iterations: 100
checkpoint_interval: 5
log_level: INFO
random_seed: 0
language: python
diff_based_evolution: true
enforce_evolve_blocks: true
max_code_length: 20000
llm:
  models:
  - name: pilot-router
    api_base: http://127.0.0.1:0/v1
    api_key: unused
    weight: 1.0
  temperature: 0.7
  top_p: 0.95
  max_tokens: 8192
  timeout: 1500
  retries: 0
  retry_delay: 0
prompt:
  system_message: 'You are an expert in high-performance numerical Python and approximate nearest-neighbour search. Your task is to improve `approximate_knn` so that it is much faster than exact brute-force search on large clustered datasets (N = 100k-250k vectors, d = 12-48) while keeping recall@k close to 1.


    Rules from the specification:

    - Return `(indices, distances)` of shape `(Q, k)`: k distinct indices per query and their true squared Euclidean distances, in ascending order.

    - When a query is identical to an indexed vector, that vector (distance 0) must be returned first.

    - Only numpy, scipy, scikit-learn and the standard library are available; no files, network or processes.


    Useful ideas: inverted-file indexes (coarse k-means cells, probe a few nearest cells), vectorised candidate gathering, re-ranking candidates with exact distances, dimensionality reduction for the coarse step.'
  num_top_programs: 3
  use_template_stochasticity: true
database:
  population_size: 60
  archive_size: 25
  num_islands: 4
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.7
  random_seed: 0
evaluator:
  timeout: 300
  max_retries: 0
  cascade_evaluation: false
  parallel_evaluations: 1
  use_llm_feedback: false
