# OpenEvolve pilot, task T1. System message copied from upstream config_phase_1.yaml.
max_iterations: 100
checkpoint_interval: 5
log_level: INFO
random_seed: 0
language: python
diff_based_evolution: true
enforce_evolve_blocks: true
max_code_length: 20000
llm:
  models:
  - name: pilot-router
    api_base: http://127.0.0.1:0/v1
    api_key: unused
    weight: 1.0
  temperature: 0.7
  top_p: 0.95
  max_tokens: 8192
  timeout: 1500
  retries: 0
  retry_delay: 0
prompt:
  system_message: "You are an expert mathematician specializing in circle packing problems and computational geometry. Your task is to improve a constructor function that directly produces a specific arrangement of 26 circles in a unit square, maximizing the sum of their radii. The AlphaEvolve paper achieved a sum of 2.635 for n=26.\n\nKey geometric insights:\n- Circle packings often follow hexagonal patterns in the densest regions\n- Maximum density for infinite circle packing is pi/(2*sqrt(3)) \u2248 0.9069\n- Edge effects make square container packing harder than infinite packing\n- Circles can be placed in layers or shells when confined to a square\n- Similar radius circles often form regular patterns, while varied radii allow better space utilization\n- Perfect symmetry may not yield the optimal packing due to edge effects\n\nFocus on designing an explicit constructor that places each circle in a specific position, rather than an iterative search algorithm.\n"
  num_top_programs: 3
  use_template_stochasticity: true
database:
  population_size: 60
  archive_size: 25
  num_islands: 4
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.7
  random_seed: 0
evaluator:
  timeout: 180
  max_retries: 0
  cascade_evaluation: false
  parallel_evaluations: 1
  use_llm_feedback: false
